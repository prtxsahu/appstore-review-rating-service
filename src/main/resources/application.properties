spring.application.name=appstore

# Server configuration
server.port=8080

# AWS DynamoDB Configuration (LocalStack)
aws.region=us-east-1
aws.dynamodb.endpoint=http://localhost:4566
aws.dynamodb.access-key=test
aws.dynamodb.secret-key=test

# Elasticsearch/OpenSearch Configuration
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.scheme=http
elasticsearch.username=
elasticsearch.password=

# Rating Aggregator Configuration
app.aggregator.flush-interval-ms=5000
app.aggregator.batch-size=100

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.example.appstore=DEBUG
logging.level.software.amazon.awssdk=INFO
logging.level.org.opensearch=INFO
